version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * 2" # Every Tuesday at 4:00 UTC
    groups:
      all-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 4 * * 2" # Every Tuesday at 4:00 UTC
    groups:
      all-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
