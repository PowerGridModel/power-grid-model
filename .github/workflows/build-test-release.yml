name: Build and Test C++ and Python

# Controls when the workflow will run
on:
  # run pipeline from another workflow
  workflow_call:

  # run this workflow manually from the Actions tab
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-main
  cancel-in-progress: true

jobs:
  acquire-python-version-build-sdist:
    name: Build sdist and set version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Set PyPI Version
        uses: PowerGridModel/pgm-version-bump@6e68939526c7d791515e0f4c61eed7b0ca9f3265 # v0.1.10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SDist
        run: |
          cat VERSION
          uv build --sdist --no-create-gitignore --out-dir wheelhouse .

      - name: Keep version file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version
          path: VERSION

      - name: Keep SDist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheelhouse
          path: ./wheelhouse/*.tar.gz

  build-cpp-test-linux:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        build-option: [debug, release]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
          - compiler: clang

    env:
      CMAKE_PREFIX_PATH: /home/linuxbrew/.linuxbrew
      PRESET: ci-${{ matrix.compiler }}-${{ matrix.build-option }}
      HOMEBREW_FORCE_BREWED_CURL: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-16 g++-16 clang-22
          sudo ln -s /usr/bin/clang-22 /usr/local/bin/clang
          sudo ln -s /usr/bin/clang++-22 /usr/local/bin/clang++
          sudo ln -s /usr/bin/gcc-16 /usr/local/bin/gcc
          sudo ln -s /usr/bin/g++-16 /usr/local/bin/g++

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install pgm-build-deps
        run: |
          uv tool install pgm-build-deps
          pgm-build-setup-ga-ci

      - name: Build and test
        run: ./build.sh -p ${{ env.PRESET }} -e -i -t

  build-cpp-test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        build-option: [debug, release]
        compiler: [msvc, clang-cl]

    env:
      PRESET: ${{ matrix.compiler }}-${{ matrix.build-option }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install pgm-build-deps
        run: |
          uv tool install pgm-build-deps
          pgm-build-setup-ga-ci

      - uses: ./.github/actions/enable-msvc

      - name: Build and test
        run: |
          # generate cmake cache
          cmake --preset ${{ env.PRESET }} -DCMAKE_PREFIX_PATH=C:\conda_envs\cpp_pkgs\Library; if(!$?) { Exit $LASTEXITCODE }
          # build
          cmake --build --preset ${{ env.PRESET }} --verbose -j 1; if(!$?) { Exit $LASTEXITCODE }
          cmake --build --preset ${{ env.PRESET }} --target all_verify_header_sets --verbose -j 1; if(!$?) { Exit $LASTEXITCODE }
          # test
          ctest --preset ${{ env.PRESET }} --output-on-failure; if(!$?) { Exit $LASTEXITCODE }
          # install
          cmake --build --preset ${{ env.PRESET }} --verbose -j 1 --target install; if(!$?) { Exit $LASTEXITCODE }

          # build and run integration test
          cd tests/package_tests; if(!$?) { Exit $LASTEXITCODE }
          cmake --preset ${{ env.PRESET }}; if(!$?) { Exit $LASTEXITCODE }
          cmake --build --preset ${{ env.PRESET }} --verbose -j 1; if(!$?) { Exit $LASTEXITCODE }
          cmake --build --preset ${{ env.PRESET }} --verbose -j 1 --target install; if(!$?) { Exit $LASTEXITCODE }
          install\${{ env.PRESET }}\bin\power_grid_model_package_test; if(!$?) { Exit $LASTEXITCODE }

  build-cpp-test-macos:
    strategy:
      matrix:
        build-option: [debug, release]
        os: [macos-26, macos-26-intel]

    runs-on: ${{ matrix.os }}
  
    env:
      CMAKE_PREFIX_PATH: /usr/local
      PRESET: ci-apple-clang-${{ matrix.build-option }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up XCode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install pgm-build-deps
        run: |
          uv tool install pgm-build-deps
          pgm-build-setup-ga-ci

      - name: Build and test
        run: ./build.sh -p ${{ env.PRESET }} -e -i -t

  build-and-test-python:
    strategy:
      matrix:
        platform: [linux-x64, linux-aarch64, macos-arm64, macos-x64, windows]
        include:
          - platform: linux-x64
            os: ubuntu-26.04
            cibw_build: "*_x86_64"
          - platform: linux-aarch64
            os: ubuntu-26.04-arm
            cibw_build: "*_aarch64"
          - platform: macos-arm64
            os: macos-26
            cibw_build: "*_arm64"
          - platform: macos-x64
            os: macos-26-intel
            cibw_build: "*_x86_64"
          - platform: windows
            os: windows-latest
            cibw_build: "*"

    runs-on: ${{ matrix.os }}
    needs: [acquire-python-version-build-sdist]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version
          path: .

      - uses: ./.github/actions/enable-msvc
        if: runner.os == 'Windows'

      - name: Set up XCode
        if: matrix.os == 'macos-26' || matrix.os == 'macos-26-intel'
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build wheels
        uses: pypa/cibuildwheel@f11181315571b24e4a3c67f1a828532793f2df55 # v4.3.2
        # GitHub Actions specific build parameters
        env:
          # pass GitHub runner info into Linux container
          CIBW_ENVIRONMENT_PASS_LINUX: GITHUB_SHA GITHUB_REF GITHUB_RUN_NUMBER
          CIBW_BUILD: ${{ matrix.cibw_build }}
        with:
          extras: "uv"

      - name: Keep wheel files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheelhouse-${{ matrix.platform }}
          path: ./wheelhouse/*.whl
